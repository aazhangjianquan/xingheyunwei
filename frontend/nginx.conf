log_format project_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent upstream=$upstream_addr';

# Docker DNS returns all API replicas; resolve keeps scale/recreate changes live.
resolver ${DNS_RESOLVER} valid=5s ipv6=off;
upstream project_api {
    zone project_api 64k;
    least_conn;
    server ${API_UPSTREAM} resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
}

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
# This is the public boundary: replace untrusted incoming forwarded headers.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 1s;
proxy_read_timeout 120s;
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 10s;
client_max_body_size 21m;

server {
    listen 80;
    access_log /var/log/nginx/access.log project_safe;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ { proxy_pass http://project_api; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}

# Preserve the separate local API/docs entry without binding ports per replica.
server {
    listen 8000;
    access_log /var/log/nginx/access.log project_safe;
    server_name _;
    location / { proxy_pass http://project_api; }
}

