log_format workspace_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status upstream=$upstream_addr';

# Only the permitted Ingress Controller may supply client addresses.
# NetworkPolicy is required because this CIDR may cover the cluster Pod network.
set_real_ip_from ${INGRESS_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

resolver ${DNS_RESOLVER} valid=5s ipv6=off;
upstream workspace_api {
    zone workspace_api 64k;
    least_conn;
    server ${API_UPSTREAM} resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
}
map $http_x_forwarded_proto $workspace_proto {
    default $scheme;
    http http;
    https https;
}
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $workspace_proto;
proxy_connect_timeout 1s;
proxy_read_timeout 120s;
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 10s;
client_max_body_size 21m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log workspace_safe;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ { proxy_pass http://workspace_api; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
